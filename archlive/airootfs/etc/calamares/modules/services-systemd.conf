#
# Systemd units manipulation for installed UniOS system
---
units:
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: false

  - name: "sddm.service"
    action: "enable"
    mandatory: false

  - name: "bluetooth.service"
    action: "enable"
    mandatory: false

  - name: "power-profiles-daemon.service"
    action: "enable"
    mandatory: false

  - name: "systemd-networkd.service"
    action: "disable"
    mandatory: false

  - name: "systemd-networkd.socket"
    action: "disable"
    mandatory: false

  - name: "systemd-resolved.service"
    action: "enable"
    mandatory: false

  - name: "iwd.service"
    action: "disable"
    mandatory: false

  - name: "sshd.service"
    action: "disable"
    mandatory: false

  - name: "choose-mirror.service"
    action: "disable"
    mandatory: false

  - name: "livecd-talk.service"
    action: "disable"
    mandatory: false

  - name: "livecd-alsa-unmuter.service"
    action: "disable"
    mandatory: false

  - name: "pacman-init.service"
    action: "disable"
    mandatory: false
